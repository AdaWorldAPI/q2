[package]
name = "cockpit-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Single-binary graph notebook — live .qmd rendering via lance-graph + deno_core"

[[bin]]
name = "q2-cockpit"
path = "src/main.rs"

[dependencies]
# Web server
axum.workspace = true
tower-http.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# SSE streaming
async-stream.workspace = true
futures-core.workspace = true

# Serialization
serde.workspace = true
serde_json = "1"

# Server-side templating — the OSINT ClassView card is rendered via a compile-
# time-checked askama template (the "XSLT" over the FieldMask projection, per
# OGAR docs/CLASSVIEW-FIELDVIEW-ASKAMA-BITMASK.md). Core crate only (render to
# String); the handler keeps its `Html<String>` axum idiom, so no askama_axum ↔
# axum version coupling. Matches woa-rs's askama pin.
askama = "0.12"

# ── The engine: lance-graph ──────────────────────────────────────────
# Parser, DataFusion planner, LanceDB storage, blasgraph columnar,
# semiring algebra, HHTL cascade. ALL queries route through here.
lance-graph.workspace = true

# Canonical R1 cycle surface: ShaderDispatch → ShaderResonance → ShaderBus → ShaderCrystal.
# Phase 2B dropped `thinking-engine` and `cognitive-shader-driver` — they're
# THINK-1 spaghetti duplicates per the lance-graph entropy ledger. The
# zero-dep contract is the canonical surface; cockpit-server impls
# `CognitiveShaderDriver` itself (see `mock_driver.rs`).
lance-graph-contract.workspace = true
# OGAR Active-Record: OgarClassView (the concrete `impl lance_graph_contract::
# ClassView`) is the DISPLAY resolver for OSINT nodes — held as `&dyn ClassView`.
# Contract owns the trait; OGAR owns the value (the #585 SoC split).
lance-graph-ogar.workspace = true
# NARS truth-revision algebra (canonical TruthValue::deduction).
lance-graph-planner.workspace = true
# Causal edge protocol (CausalEdge64 wire format).
causal-edge.workspace = true

# Query routing layer — dispatches Cypher/Gremlin/SPARQL to lance-graph
notebook-query.workspace = true

# AIwar renderer — loads graph data into the engine
aiwar-ingest = { path = "../aiwar-ingest" }

# CPIC pharmacogenomics — standalone crate (serde + serde_json only, NO lance
# closure). Provides cpic::reason over the baked CPIC tables for the /cpic panel.
cpic = { path = "../../cpic" }

# Real OSM feature data — the query side of the `RowSlab` Morton-sorted SoA
# bake (`../lance-graph`/`../OGAR` sibling convention). Deliberately NOT the
# `osm_tiles` module above: that computes q2's own display-only 3-tier HHTL
# address for the cockpit panel; this crate's `RowSlab::tile_range` uses a
# DIFFERENT 4-tier, TMS-Y-flipped key internally. See osm_features.rs.
osm-soa-bake = { path = "../../../openstreetmap-website-rs" }
# mmap for the baked slab (1+ GiB — far too large to embed or read fully into
# memory). Pinned to the same 0.5 line osm-soa-bake itself uses, so the
# dependency tree carries one memmap2 version, not two.
memmap2 = "0.5"
# S3 -> volume hydration for the OSM slab (`osm_slab_hydrate`). `object_store`
# is already in the graph via lance/datafusion at this exact version, so this
# adds no new transitive tree — and its `AmazonS3Builder::from_env()` reads the
# AWS_* vars directly, so there is no hand-rolled SigV4 here.
object_store = { version = "0.13.2", features = ["aws"] }
sha2 = "0.10"
hex = "0.4"
futures = "0.3"


# ── Quarto rendering pipeline ───────────────────────────────────────
# pampa parses .qmd, quarto-core renders, deno_core executes JS/TS cells
quarto-core.workspace = true
quarto-system-runtime.workspace = true
deno_core.workspace = true
serde_v8.workspace = true

# ── SIMD compute — the REAL AdaWorldAPI/ndarray fork, used DIRECTLY ──
# Same local checkout lance-graph compiles. SIMD (dot/hamming/popcount, BLAS
# L1-L3, CAM-PQ) goes through `ndarray::simd` / `ndarray::backend` / `ndarray::hpc`
# — the fork's own AVX-512→AVX2→scalar polyfill (compile-time target-cpu=v4 flips
# cfg(target_feature="avx512f"); runtime simd_caps() lights up AMX/BF16). No
# q2-ndarray wrapper: one binary, one fork, no indirection.
# `splat3d` adds the HHTL depth-cascade (`ndarray::hpc::splat3d::depth_cascade`)
# used by /api/body/lod for server-side LOD selection. It only pulls `std`
# (no extra dep tree), merged on top of the workspace `std`+`hpc-extras`.
ndarray = { workspace = true, features = ["splat3d"] }

# ── Embedded frontend ──────────────────────────────────────────
# When embed-cockpit feature is on, the Vite React build (cockpit/dist/)
# is compiled into the binary via include_dir!
include_dir = { version = "0.7", optional = true }

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["planner"]
# Embed the Vite React build into the binary. Requires cockpit/dist/ to exist.
# Build with: cd cockpit && npm run build && cd .. && cargo build -p cockpit-server --features embed-cockpit
# The Dockerfile handles this automatically (Stage 1 builds Vite, Stage 2 builds Rust).
# Without this feature, the binary serves a fallback HTML shell with MCP/SSE connectivity.
embed-cockpit = ["dep:include_dir"]
planner = ["notebook-query/planner"]
orchestrator = ["notebook-query/orchestrator"]
# Neo4j Aura fallback — only for live demos when lance-graph is unreachable
neo4j-fallback = ["notebook-query/neo4j-fallback"]
