# geo — OSM-addressed geography, baked into the HHTL substrate and emitted as the
# SAME SPM1 mesh wire the cockpit already decodes for the FMA anatomy body.
#
# The geo twin of the `fma` crate (this repo, standalone): `fma` renders human
# anatomy from HHTL GUIDs; `geo` renders OSM features from HHTL GUIDs. Same
# decode, same wire, different domain binding of the 256×256 centroid-tile
# cascade — OSM binds the tier axes to literal WebMercator x/y (OGAR canon
# "Tier interpretation — 256×256 CENTROID TILE": "domains bind the axes (OSM:
# literal x/y; semantic: PQ subspace pairs); the algebra is identical").
#
# Deliberately zero-dep (only std), like `fma` (which carries only `png`): the
# HHTL address math, the SPM1 writer, and the footprint extruder are all pure.
# The OSM `.osm.pbf` ingestion — the only part needing an external reader — is
# intentionally NOT in this lib; it lands in a `bin` once the reader is chosen.
[package]
name = "geo-hhtl"
version = "0.1.0"
edition = "2021"
publish = false
description = "OSM geography baked into the HHTL substrate, emitted as SPM1 (the geo twin of the fma anatomy crate)."
license = "Apache-2.0"

# Own workspace root — isolated from the q2 Quarto workspace, exactly like fma.
[workspace]

# The lib is dep-free (pure std). The `osm_bake` bin needs to read compressed
# protobuf `.osm.pbf`, which is not hand-rollable without an inflate+protobuf
# dep; `osmpbf` is the standard reader (crates.io leaf, no AdaWorldAPI fork).
# Contained in this isolated crate's own workspace — never touches Quarto.
[dependencies]
osmpbf = "0.3"

[profile.release]
opt-level = 3
codegen-units = 1
